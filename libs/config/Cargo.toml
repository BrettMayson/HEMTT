[package]
name = "hemtt-config"
version.workspace = true
edition.workspace = true
description = "A config parser library for hemtt"
license = "GPL-2.0"

[lints]
workspace = true

[lib]
bench = false

[dependencies]
hemtt-common = { path = "../common" }
hemtt-workspace = { path = "../workspace" }

automod = { workspace = true }
byteorder = { workspace = true }
chumsky = { workspace = true }
fs-err = { workspace = true }
glob = { workspace = true }
indexmap = { workspace = true }
linkme = { workspace = true }
lsp-types = { workspace = true } #cargo::unused_dependencies false positive
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
hemtt-preprocessor = { path = "../preprocessor" }
insta = { workspace = true }
paste = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
fs-err = { workspace = true }
