[package]
name = "hemtt-vers"
description = "HEMTT Launcher & Updater"
version = "1.0.0"
edition.workspace = true
license = "GPL-2.0"
authors = ["Brett Mayson <brett@mayson.io>"]
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
dirs = { workspace = true }
fs-err = { workspace = true }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
semver = "1.0"
serde = { workspace = true, features = ["derive"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
